[project]
name = "pypwr2"
version = "0.2.3"
description = "A python port of the R package 'pwr'"
readme = "README.md"
authors = [
    { name = "Logan Hufstetler", email = "loganhufstetler@protonmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "scipy",
    "numpy",
    "pandas"
]

[project.scripts]
pypwr2 = "pypwr2:main"


[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = "src"
addopts = [
    "--import-mode=importlib",
]


[dependency-groups]
dev = [
    "pip>=26.3",
]
